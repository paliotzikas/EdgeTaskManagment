# AHP + Rough Sets queue scenario configuration.
simulation_time=600
node_count=5
poisson_rates=0.8,1.4,2.1,3.0,4.0
arrival_tick_seconds=1
high_arrival_rate_threshold=3.0
threshold_mode=ADAPTIVE_RATE
threshold_multiplier=1.2

random_seed=42
vary_seed_by_iteration=1
offloading_policy=AHP_ROUGH
decision_mode=PROACTIVE
offload_destination_policy=LEAST_QUEUE
delay_probability=0.25
min_delay_multiplier=1.5
max_delay_multiplier=3.0

offload_fraction=0.40
max_offloads_per_event=10
max_task_offloads=1

# Proactive risk estimation. The existing delayed-task trigger remains an emergency fallback.
arrival_ewma_alpha=0.30
prediction_horizon_seconds=10
proactive_queue_multiplier=1.20
proactive_min_queue_threshold=5
offload_cooldown_seconds=40
reactive_fallback_enabled=1

min_execution_time=2
max_execution_time=8
min_priority=1
max_priority=10
min_steps=1
max_steps=20
min_complexity=1
max_complexity=10
min_deadline_slack=20
max_deadline_slack=120

# Criteria order: priority, steps, complexity, deadline.
# Priority and earlier deadline are favored; lower steps and lower complexity are favored.
ahp_pairwise_matrix=1,3,5,0.5|0.333333,1,2,0.25|0.2,0.5,1,0.2|2,4,5,1
